
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Mundial — Trabalhos dos Alunos</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#263238}
header{background:#0b4f71;color:white;padding:18px 24px;box-shadow:0 2px 8px #0002}
header h1{margin:0 0 6px;font-size:25px}
header p{margin:0;font-size:14px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:calc(100vh - 80px)}
#map-area{position:relative;background:#dcecf3;overflow:hidden;min-height:620px}
#map{width:100%;height:100%;min-height:620px;display:block}
.country{fill:#c9d4d9;stroke:white;stroke-width:.6px;cursor:pointer;transition:fill .15s}
.country:hover{fill:#80b5c9}
.country.selected{fill:#f1a340;stroke:#8a4f00;stroke-width:1.5px}
.ocean{fill:#dcecf3}
.controls{position:absolute;left:18px;top:18px;display:flex;flex-direction:column;gap:6px}
.controls button{width:38px;height:38px;border:0;border-radius:5px;background:white;color:#263238;font-size:22px;cursor:pointer;box-shadow:0 2px 7px #0002}
.controls button:hover{background:#eef3f5}
.hint{position:absolute;left:18px;bottom:18px;background:#fffffff0;padding:9px 12px;border-radius:6px;font-size:13px;box-shadow:0 2px 7px #0002}
#panel{background:white;border-left:1px solid #d7dfe3;padding:22px;overflow-y:auto;min-width:0}
.search{margin-bottom:16px}
.search input{width:100%;padding:11px 12px;border:1px solid #c9d2d6;border-radius:6px;font-size:15px}
.search input:focus{outline:2px solid #b4d7e6}
.country-title{display:flex;align-items:center;gap:12px;border-bottom:1px solid #e1e5e7;padding-bottom:15px;margin-bottom:16px}
.flag{font-size:42px}
.country-title h2{margin:0;font-size:24px;color:#0b4f71}
.country-title small{display:block;color:#68777f;margin-top:5px}
.section{margin:18px 0}
.section h3{font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:#0b4f71;margin:0 0 10px}
.empty{color:#68777f;line-height:1.5;text-align:center;padding:35px 12px}
.work-card{border:1px solid #dce3e6;border-radius:8px;padding:12px;margin:10px 0;background:#fff}
.work-card h4{margin:0 0 7px;font-size:15px;overflow-wrap:anywhere}
.work-card p{font-size:13px;color:#53636a;margin:5px 0;overflow-wrap:anywhere}
.work-card a{display:inline-block;margin-top:9px;color:#0b5d87;font-weight:bold;text-decoration:none}
.work-card a:hover{text-decoration:underline}
.preview{display:block;width:100%;max-height:230px;object-fit:contain;margin-top:10px;border-radius:5px;background:#f1f5f7}
.status{font-size:13px;color:#596b73;line-height:1.5}
.status.error{color:#a12622}
.badge{display:inline-block;background:#e8f2f6;color:#174a63;border-radius:20px;padding:4px 9px;font-size:12px;margin-bottom:8px}
footer{font-size:11px;color:#7a878d;border-top:1px solid #e1e5e7;padding-top:12px;margin-top:20px;line-height:1.5}
@media(max-width:850px){
 .layout{grid-template-columns:1fr}
 #map-area,#map{min-height:470px}
 #panel{min-height:350px;border-left:0;border-top:1px solid #d7dfe3}
}
</style>
</head>
<body>

<header>
  <h1>Atlas Mundial</h1>
  <p>Selecione um país para consultar os trabalhos enviados pelos alunos.</p>
</header>

<div class="layout">
  <section id="map-area">
    <svg id="map" aria-label="Mapa-múndi interativo"></svg>
    <div class="controls">
      <button id="zoom-in" title="Aumentar">+</button>
      <button id="zoom-out" title="Diminuir">−</button>
      <button id="reset" title="Recentrar">⌂</button>
    </div>
    <div class="hint">Clique em um país • Use + e − para aproximar</div>
  </section>

  <aside id="panel">
    <div class="search">
      <input id="search" type="search" placeholder="Pesquisar país em português...">
    </div>
    <div id="panel-content">
      <div class="empty">
        <h2>Atlas Mundial</h2>
        <p>Selecione um país no mapa ou pesquise seu nome para consultar os trabalhos cadastrados.</p>
        <p id="load-status" class="status">Carregando mapa e trabalhos...</p>
      </div>
    </div>
  </aside>
</div>

<script>

// Complementa países que podem ter códigos ou denominações diferentes.
const aliases = {
"czechia":"República Tcheca",
"czech republic":"República Tcheca",
"democratic republic of the congo":"República Democrática do Congo",
"republic of the congo":"Congo",
"congo":"Congo",
"ivory coast":"Costa do Marfim",
"cote d ivoire":"Costa do Marfim",
"the netherlands":"Países Baixos",
"netherlands":"Países Baixos",
"holland":"Países Baixos",
"chad":"Chade",
"united states":"Estados Unidos",
"united states of america":"Estados Unidos",
"usa":"Estados Unidos",
"united kingdom":"Reino Unido",
"russian federation":"Rússia",
"viet nam":"Vietnã",
"vietnam":"Vietnã",
"north korea":"Coreia do Norte",
"south korea":"Coreia do Sul",
"republic of korea":"Coreia do Sul",
"iran":"Irã",
"moldova":"Moldávia",
"lao pdr":"Laos",
"syrian arab republic":"Síria",
"brunei darussalam":"Brunei",
"eswatini":"Eswatini",
"swaziland":"Eswatini",
"micronesia":"Micronésia",
"federated states of micronesia":"Micronésia",
"macedonia":"Macedônia do Norte",
"north macedonia":"Macedônia do Norte",
"palestine":"Palestina",
"east timor":"Timor-Leste",
"cape verde":"Cabo Verde",
"cabo verde":"Cabo Verde",
"western sahara":"Saara Ocidental",
"somaliland":"Somalilândia"
};

function normalize(value) {
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/&/g, " e ")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

const aliasesNormalized = {};
Object.entries(aliases).forEach(([key,value]) => {
  aliasesNormalized[normalize(key)] = value;
});

function countryName(id) {
  return countries[String(id).padStart(3,"0")] || "País não identificado";
}

function flagEmoji(name) {
  const flags = {
    "Brasil":"🇧🇷","Alemanha":"🇩🇪","África do Sul":"🇿🇦",
    "Estados Unidos":"🇺🇸","China":"🇨🇳","Índia":"🇮🇳",
    "Rússia":"🇷🇺","França":"🇫🇷","Japão":"🇯🇵",
    "Países Baixos":"🇳🇱","Chade":"🇹🇩","Portugal":"🇵🇹",
    "Reino Unido":"🇬🇧","Argentina":"🇦🇷","Chile":"🇨🇱",
    "Austrália":"🇦🇺","Canadá":"🇨🇦","México":"🇲🇽",
    "Espanha":"🇪🇸","Itália":"🇮🇹"
  };
  return flags[name] || "🌎";
}

const svg = d3.select("#map");
const mapArea = document.getElementById("map-area");
const panel = document.getElementById("panel-content");

let width = 0, height = 0;
let projection, path, worldGroup, countriesLayer, zoom;
let features = [];
let selectedId = null;
let works = {};
let mapReady = false;

function resizeMap() {
  if (!mapReady) return;
  width = mapArea.clientWidth;
  height = mapArea.clientHeight;
  svg.attr("viewBox",`0 0 ${width} ${height}`)
     .attr("width",width).attr("height",height);

  projection = d3.geoNaturalEarth1()
    .fitExtent([[12,12],[width-12,height-12]],{type:"Sphere"});
  path = d3.geoPath(projection);

  worldGroup.select(".sphere").attr("d",path);
  countriesLayer.selectAll("path").attr("d",path);
}

function getCountryWorks(name) {
  const wanted = normalize(name);
  const keys = Object.keys(works);
  const exact = keys.find(key => normalize(key) === wanted);
  if (exact) return works[exact] || [];

  const aliasMatch = keys.find(key => {
    const normalizedKey = normalize(key);
    const translated = aliasesNormalized[normalizedKey];
    return translated && normalize(translated) === wanted;
  });
  if (aliasMatch) return works[aliasMatch] || [];

  const aliasesForWanted = Object.entries(aliasesNormalized)
    .filter(([,value]) => normalize(value) === wanted)
    .map(([key]) => key);

  const alternate = keys.find(key =>
    aliasesForWanted.includes(normalize(key))
  );
  return alternate ? (works[alternate] || []) : [];
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[char]);
}

function drivePreviewUrl(url) {
  const text = String(url || "");
  const match = text.match(/\/file\/d\/([a-zA-Z0-9_-]+)/)
    || text.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return match ? "https://drive.google.com/thumbnail?id=" +
    encodeURIComponent(match[1]) + "&sz=w700" : "";
}

function renderWorks(name) {
  const list = getCountryWorks(name);
  if (!list.length) {
    return `<div class="empty">
      <p>Ainda não há trabalhos cadastrados para <strong>${escapeHTML(name)}</strong>.</p>
      <p>Quando um aluno enviar um trabalho pelo formulário, ele aparecerá aqui.</p>
    </div>`;
  }

  return `<div class="section">
    <span class="badge">${list.length} trabalho(s) cadastrado(s)</span>
    ${list.map(work => {
      const url = String(work.url || "");
      const filename = escapeHTML(work.filename || "Abrir arquivo");
      const student = escapeHTML(work.name || "Aluno");
      const date = escapeHTML(work.date || "");
      const preview = work.mimeType && work.mimeType.startsWith("image/")
        ? drivePreviewUrl(url) : "";

      return `<article class="work-card">
        <h4>${filename}</h4>
        <p><strong>Aluno:</strong> ${student}</p>
        ${date ? `<p><strong>Data de envio:</strong> ${date}</p>` : ""}
        ${preview ? `<a href="${escapeHTML(url)}" target="_blank" rel="noopener">
          <img class="preview" src="${escapeHTML(preview)}"
          alt="Prévia de ${filename}" loading="lazy"
          onerror="this.style.display='none'"></a>` : ""}
        <a href="${escapeHTML(url)}" target="_blank" rel="noopener">
          Abrir ou baixar trabalho ↗
        </a>
      </article>`;
    }).join("")}
  </div>`;
}

function showCountry(id) {
  const key = String(id).padStart(3,"0");
  const name = countryName(key);
  selectedId = key;

  countriesLayer.selectAll(".country")
    .classed("selected",d => String(d.id).padStart(3,"0") === key);

  const feature = features.find(d =>
    String(d.id).padStart(3,"0") === key
  );

  panel.innerHTML = `
    <div class="country-title">
      <div class="flag">${flagEmoji(name)}</div>
      <div><h2>${escapeHTML(name)}</h2>
      <small>Atlas Mundial</small></div>
    </div>
    <div class="section"><h3>Trabalhos dos alunos</h3>
      ${renderWorks(name)}
    </div>
    <p id="works-refresh" class="status"></p>
    <footer>Os trabalhos são consultados na planilha conectada ao formulário. Os arquivos são abertos pelo Google Drive.</footer>
  `;

  if (feature) {
    const bounds = path.bounds(feature);
    const dx = bounds[1][0] - bounds[0][0];
    const dy = bounds[1][1] - bounds[0][1];
    const cx = (bounds[0][0] + bounds[1][0])/2;
    const cy = (bounds[0][1] + bounds[1][1])/2;
    const scale = Math.max(1,Math.min(5,0.7/Math.max(dx/width,dy/height)));
    const transform = d3.zoomIdentity
      .translate(width/2,height/2)
      .scale(scale)
      .translate(-cx,-cy);
    svg.transition().duration(500).call(zoom.transform,transform);
  }
}

function resetMap() {
  selectedId = null;
  countriesLayer.selectAll(".country").classed("selected",false);
  svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity);
}

function buildMap(world) {
  width = mapArea.clientWidth;
  height = mapArea.clientHeight;
  svg.attr("width",width).attr("height",height);

  projection = d3.geoNaturalEarth1()
    .fitExtent([[12,12],[width-12,height-12]],{type:"Sphere"});
  path = d3.geoPath(projection);

  worldGroup = svg.append("g");
  worldGroup.append("path")
    .datum({type:"Sphere"})
    .attr("class","ocean sphere")
    .attr("d",path);

  features = topojson.feature(world,world.objects.countries).features;

  countriesLayer = worldGroup.append("g");
  countriesLayer.selectAll(".country")
    .data(features)
    .join("path")
    .attr("class","country")
    .attr("d",path)
    .attr("aria-label",d => countryName(d.id))
    .on("click",function(event,d) {
      event.stopPropagation();
      showCountry(d.id);
    });

  zoom = d3.zoom()
    .scaleExtent([1,8])
    .on("zoom",event => worldGroup.attr("transform",event.transform));

  svg.call(zoom);
  svg.on("dblclick.zoom",null);

  document.getElementById("zoom-in").onclick = () =>
    svg.transition().duration(250).call(zoom.scaleBy,1.4);
  document.getElementById("zoom-out").onclick = () =>
    svg.transition().duration(250).call(zoom.scaleBy,1/1.4);
  document.getElementById("reset").onclick = resetMap;

  mapReady = true;
  resizeMap();
  document.getElementById("load-status").textContent =
    "Mapa carregado. Selecione um país para consultar os trabalhos.";
}

function loadWorks() {
  const callbackName = "atlasWorksCallback";
  const oldScript = document.getElementById("works-script");
  if (oldScript) oldScript.remove();

  window[callbackName] = function(response) {
    try {
      works = response && response.works ? response.works : {};
      const status = document.getElementById("load-status");
      if (status) status.textContent =
        "Trabalhos carregados. Selecione um país no mapa.";

      if (selectedId) showCountry(selectedId);
    } catch(error) {
      showWorksError("Não foi possível interpretar os trabalhos recebidos.");
    } finally {
      delete window[callbackName];
      const script = document.getElementById("works-script");
      if (script) script.remove();
    }
  };

  const script = document.createElement("script");
  script.id = "works-script";
  script.src = API_URL + "?action=list&callback=" + callbackName +
    "&_=" + Date.now();
  script.onerror = function() {
    showWorksError("Não foi possível acessar os trabalhos. Confira a conexão e a publicação do Apps Script.");
    delete window[callbackName];
    script.remove();
  };
  document.head.appendChild(script);
}

function showWorksError(message) {
  const status = document.getElementById("load-status");
  if (status) {
    status.textContent = message;
    status.classList.add("error");
  }
}

function searchCountry(term) {
  const normalized = normalize(term);
  if (!normalized) return;

  const result = features.find(feature =>
    normalize(countryName(feature.id)).includes(normalized)
  );

  if (result) {
    showCountry(result.id);
    return;
  }

  const alias = aliasesNormalized[normalized];
  if (alias) {
    const byAlias = features.find(feature =>
      normalize(countryName(feature.id)) === normalize(alias)
    );
    if (byAlias) {
      showCountry(byAlias.id);
      return;
    }
  }

  panel.innerHTML = `<div class="empty">
    <h2>País não encontrado</h2>
    <p>Verifique a grafia ou tente pesquisar pelo nome em português.</p>
  </div>`;
}

document.getElementById("search").addEventListener("keydown",event => {
  if (event.key === "Enter") searchCountry(event.target.value.trim());
});

document.getElementById("search").addEventListener("input",event => {
  const term = event.target.value.trim();
  if (term.length >= 3) {
    const normalized = normalize(term);
    const result = features.find(feature =>
      normalize(countryName(feature.id)).startsWith(normalized)
    );
    if (result) {
      // A pesquisa não seleciona automaticamente enquanto se está digitando.
      // Pressione Enter para abrir o país desejado.
    }
  }
});

Promise.all([
  d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
]).then(([world]) => {
  buildMap(world);
  loadWorks();
}).catch(error => {
  panel.innerHTML = `<div class="empty">
    <h2>Não foi possível carregar o mapa</h2>
    <p>Verifique a conexão com a internet e recarregue a página.</p>
  </div>`;
  console.error(error);
});

window.addEventListener("resize",resizeMap);
</script>
</body>
</html>
